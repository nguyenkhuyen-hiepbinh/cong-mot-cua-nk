services:
  - type: web
    name: cong-mot-cua-app
    runtime: node
    plan: free
    region: singapore
    branch: main
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: false
    envVars:
      - key: ADMIN_PIN
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: GITHUB_REPO
        value: nguyenkhuyen-hiepbinh/cong-mot-cua-nk
      - key: GITHUB_FILE
        value: dulieu.json
      - key: GITHUB_BRANCH
        value: main
